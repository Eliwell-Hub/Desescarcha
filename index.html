f.addEventListener('submit',async function(){e.textContent='Comprobando…';try{var k=await derivar(document.getElementById('k').value);await abrir(k);if(document.getElementById('r')&&document.getElementById('r').checked){}try{if(window._recordar){var raw=await crypto.subtle.exportKey('raw',k);localStorage.setItem('desescarcha:k',JSON.stringify({s:C.s,k:a64(raw)}));}}catch(x){}}catch(x){e.textContent='Contraseña incorrecta';}});
document.getElementById('r').addEventListener('change',function(){window._recordar=this.checked;});window._recordar=true;
(async function(){if(!window.crypto||!crypto.subtle){f.style.display='';e.textContent='Ábrela desde su link (https).';return;}try{var g=JSON.parse(localStorage.getItem('desescarcha:k')||'null');if(g&&g.s===C.s){var k=await crypto.subtle.importKey('raw',b64(g.k),{name:'AES-GCM'},false,['decrypt']);await abrir(k);return;}}catch(x){try{localStorage.removeItem('desescarcha:k');}catch(y){}}f.style.display='';})();
</script>
