<script>
/* ═══════════════════════════════════════════════════════════════════════════
   DESESCARCHA — asistente de programación de desescarches (RTX 600 / RTN / V800)
   2026-11-10 — Rafa: «una nueva utilidad, "Desescarcha": una especie de wizard,
   seleccionando cómo tenemos la instalación, indicando qué son maestros y qué
   esclavos y qué cantidad de cada tipo de servicio. Generaremos un mapeado de
   parametrización para ajustar los desescarches en los horarios… un informe tipo
   los que hacemos nosotros bien pro… el gráfico… máximos de servicios… y poder
   decir cuál es maestro de cuál (no tiene por qué ser el 1 del 2)».
   Modelo: «Informe de revisión — Desescarches tienda 7026 Independencia»
   (27/05/2026): murales Fdn=8 / dit 3 h, grupos cada 15 min desde las 00:00 con
   hasta 2 maestros por grupo; cámaras cada 90 min; vitrinas desde 01:30 cada 3 h;
   armarios desde 02:30 cada 4 h; islas semanales lunes y viernes (Fd1/Fd2 + F1H).
   Esclavos: dCt=2, dit = el del maestro + 1, Fdn=0 (siguen al maestro por Link2).
   Parámetros (dbo.ParamBase RTX600/V): d1H/d1n hora del 1.er desescarche laborable
   (solo dCt=4; d1H=24 deshabilitado) · dit intervalo (0 = nunca) · Fdn nº de
   desescarches al día · Fd1/Fd2 días «festivo» 0–6 (domingo…sábado; 7 = no) ·
   F1H/F1n hora del desescarche de esos días · dOH retardo desde la llamada.
   Se guarda en la BD (dbo.ConfigSistema 'desescarcha:<centro>') y, sin BD, en el
   navegador. Todos los valores por defecto son editables.
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','— (no)'];
  var PARAMS=['dCt','dOH','dit','Fdn','d1H','d1n','Fd1','Fd2','F1H','F1n'];
  var TIPOS_DEF=[
    {id:'mural',   nombre:'Murales',          fam:'pos', modo:'diario',  max:60, pref:'MURAL',    fdn:8, dit:3,  ini:'00:00', sep:15,  porSlot:2, dur:30, color:'#2F80ED', patron:/MURAL/i},
    {id:'vitrina', nombre:'Vitrinas',         fam:'pos', modo:'diario',  max:20, pref:'VITRINA',  fdn:4, dit:6,  ini:'01:30', sep:180, porSlot:1, dur:30, color:'#F2994A', patron:/VITRIN|VIT\./i},
    {id:'camara',  nombre:'Cámaras',          fam:'neg', modo:'diario',  max:20, pref:'CÁMARA',   fdn:4, dit:7,  ini:'01:00', sep:90,  porSlot:1, dur:30, color:'#9B51E0', patron:/C[ÁA]M|CAMARA/i},
    {id:'armario', nombre:'Armarios',         fam:'neg', modo:'diario',  max:30, pref:'ARMARIO',  fdn:2, dit:12, ini:'02:30', sep:240, porSlot:1, dur:30, color:'#27AE60', patron:/ARMARIO/i},
    {id:'isla',    nombre:'Islas semanales',  fam:'neg', modo:'semanal', max:40, pref:'ISLA',     fdn:0, dit:96, ini:'01:00', sep:60,  porSlot:1, dur:30, color:'#EB5757', fd1:1, fd2:5, patron:/ISLA/i},
    {id:'otro',    nombre:'Otros servicios',  fam:'pos', modo:'diario',  max:40, pref:'SERVICIO', fdn:4, dit:6,  ini:'03:00', sep:60,  porSlot:1, dur:30, color:'#56CCF2', patron:null}
  ];
  var PASOS=['1 · Centro','2 · Servicios','3 · Maestros y esclavos','4 · Distribución','5 · Resultado e informe'];
  var D=null, paso=0, _seq=0;
  /* Funciona SOLA (archivo para instaladores) o DENTRO del Hub (marco de la sección «Desescarcha»).
     Dentro del Hub usa lo del Hub: Televis conectado, base de datos e informes Word/PDF del servidor.
     Sola: guarda/abre en archivo (.json), PDF con la impresión del navegador y Word como documento .doc. */
  var HUB=null; try{ if(window.parent&&window.parent!==window&&typeof window.parent.hubActivate==='function') HUB=window.parent; }catch(e){}
  function hubTG(){ return HUB&&HUB.TG; }
  function api(){ return HUB?(HUB._tgAPIraw||HUB.tgAPI):null; }
  function dl(contenido, mime, nombre){ var b=new Blob([contenido],{type:mime}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },3000); }

  function diasTxt(t, corto, sep){ var a=DIAS[+t.fd1]||'', b=(+t.fd2>=0&&+t.fd2<7)?DIAS[+t.fd2]:''; if(corto){ a=a.slice(0,3); b=b.slice(0,3); } return b?(a+(sep||' y ')+b):a; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function hoy(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fFecha(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(m[3]+'/'+m[2]+'/'+m[1]):(s||''); }
  function aMin(hhmm){ var m=String(hhmm||'0:0').match(/^(\d{1,2}):(\d{2})/); return m?((+m[1])*60+(+m[2]))%1440:0; }
  function hhmm(min){ min=((Math.round(min)%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
  function nuevoId(){ return 's'+Date.now().toString(36)+(++_seq); }
  function tipoDe(id){ return D.tipos.find(function(t){ return t.id===id; }); }
  function svc(id){ return D.servicios.find(function(s){ return s.id===id; }); }
  function deTipo(tid){ return D.servicios.filter(function(s){ return s.tipo===tid; }); }

  function plan0(){
    return {version:1, cod:'', nombre:'', fecha:hoy(), controlador:'RTX 600/V Domino Zero', obs:'',
      umbrales:{medio:6, alta:7}, cargaModo:'grupos', reparto:'auto',
      tipos:[],   // 2026-11-10 — los grupos de servicios se crean en el paso 2 (antes, tipos fijos)
      servicios:[]};
  }
  /* 2026-11-10 — Rafa: «en la pantalla de los servicios deja desplegables con toda la información y se van
     generando los servicios: el nombre, positivo o negativo, cuántos desescarches, día o semana, cantidad… al
     final uno de crear y pasas al siguiente». Cada «Crear» da un GRUPO de servicios (p. ej. «MURAL VERDURA» × 4)
     con sus valores de reparto tomados del mueble elegido (se cambian en el paso 4). */
  var PALETA=['#2F80ED','#F2994A','#9B51E0','#27AE60','#EB5757','#56CCF2','#F2C94C','#BB6BD9','#219653','#2D9CDB','#E2725B','#6FCF97'];
  var FORM={mueble:'mural', nombre:'MURAL', fam:'pos', modo:'diario', cuantos:8, cantidad:1, desde:1};
  function preset(id){ return TIPOS_DEF.find(function(x){ return x.id===id; })||TIPOS_DEF[TIPOS_DEF.length-1]; }
  function nuevoGrupo(o){
    var b=preset(o.mueble), modo=o.modo||b.modo, cu=parseInt(o.cuantos,10)||(modo==='semanal'?2:b.fdn||1);
    var t={id:'g'+Date.now().toString(36)+(++_seq), mueble:b.id, nombre:o.nombre||b.nombre, pref:o.nombre||b.pref, fam:o.fam||b.fam, modo:modo,
      fdn:(modo==='diario'?cu:0), dit:(modo==='diario'?Math.round(24/cu*10)/10:96), ini:b.ini, sep:b.sep, porSlot:b.porSlot, dur:b.dur,
      fd1:1, fd2:(modo==='semanal'&&cu>=2?5:7), max:40, n:0, orden:[], color:PALETA[D.tipos.length%PALETA.length]};
    if(b.id==='camara'&&modo==='diario') t.dit=b.dit;   // cámaras: dit de seguridad del informe de referencia (7 h)
    D.tipos.push(t); return t;
  }
  function guardarBorrador(){ try{ localStorage.setItem('des:borrador', JSON.stringify(D)); }catch(e){} }
  function cargarBorrador(){ try{ var x=JSON.parse(localStorage.getItem('des:borrador')||'null'); if(x&&x.tipos) return x; }catch(e){} return null; }

  // ── servicios por tipo: ajustar la cantidad conservando nombres y papeles ──
  function ajustarCantidad(tid, n){
    var t=tipoDe(tid); n=Math.max(0, Math.min(t.max, parseInt(n,10)||0));
    var L=deTipo(tid);
    if(L.length<n){ var base=(t.desde!=null?+t.desde:1); for(var i=L.length;i<n;i++){ var s={id:nuevoId(), tipo:tid, nombre:t.pref+(n>1||base!==1?' '+(base+i):''), rol:'M', maestro:null, actual:null}; D.servicios.push(s); } }
    else if(L.length>n){
      var fuera=L.slice(n).map(function(s){ return s.id; });
      D.servicios=D.servicios.filter(function(s){ return fuera.indexOf(s.id)<0; });
      D.servicios.forEach(function(s){ if(fuera.indexOf(s.maestro)>=0){ s.rol='M'; s.maestro=null; } });
    }
    t.n=n; sincronizarOrden();
  }
  // orden de los maestros de cada tipo (para repartir los huecos); los nuevos al final
  function sincronizarOrden(){
    D.tipos.forEach(function(t){
      var M=deTipo(t.id).filter(function(s){ return s.rol==='M'; }).map(function(s){ return s.id; });
      t.orden=(t.orden||[]).filter(function(id){ return M.indexOf(id)>=0; });
      M.forEach(function(id){ if(t.orden.indexOf(id)<0) t.orden.push(id); });
      t.n=deTipo(t.id).length;
    });
  }

  // ══════════════════════ CÁLCULO ══════════════════════
  /* 2026-11-10 — con grupos creados a mano («MURAL VERDURA», «MURAL CARNES»…), los del MISMO mueble y modo
     comparten una sola secuencia de horarios, como en el informe de referencia (verdura 00:00, lácteos 00:15…
     carnes 02:45; islas 1, 2, 3… h): primer arranque, separación, maestros por grupo y duración son de la
     cadena (D.cadenas); Fdn/dit o días semanales, de cada grupo. Los grupos siguen el orden de la lista. */
  function claveCad(t){ return (t.mueble||t.id)+':'+t.modo; }
  function cadena(t){
    D.cadenas=D.cadenas||{}; var k=claveCad(t);
    if(!D.cadenas[k]){ var b=preset(t.mueble); D.cadenas[k]={ini:t.ini||b.ini, sep:(t.sep!=null?t.sep:b.sep), porSlot:t.porSlot||b.porSlot, dur:t.dur||b.dur, nombre:(b.id==='otro'?t.nombre:b.nombre)}; }
    return D.cadenas[k];
  }
  function cadenas(){   // [{clave, cad, grupos:[t…]}] en el orden de la lista
    var out=[], idx={};
    D.tipos.forEach(function(t){ var k=claveCad(t); if(idx[k]==null){ idx[k]=out.length; out.push({clave:k, cad:cadena(t), grupos:[]}); } out[idx[k]].grupos.push(t); });
    return out;
  }
  /* 2026-11-10 — Rafa: «supuestamente el programa es el que tiene que distribuirlo de la mejor manera posible».
     REPARTO AUTOMÁTICO (por defecto): para cada maestro se prueban todos los huecos de su mueble (primer arranque
     + q·separación, dentro de su ventana y con como mucho «maestros por hueco») y se elige el que deja MENOS
     desescarches a la vez en la franja de 30 min más cargada, teniendo en cuenta todo el día (repeticiones cada
     24/Fdn h) y todos los muebles. A igualdad, se respeta el orden de los grupos y después la suma de carga.
     Los que llevan hueco u hora a mano se colocan primero y no se mueven. Primero los que más se repiten. */
  function _cmp(a,b){ for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }
  /* 2026-11-10 (2) — mejor reparto: tras el primer reparto (voraz) se prueba a mover cada maestro de hueco mientras
     mejore: 1.º la franja más cargada, 2.º cuántas franjas están en ese máximo, 3.º lo desigual (suma de cuadrados),
     4.º el orden de los grupos. «🔀 Redistribuir» repite todo con muchos órdenes distintos y guarda el mejor
     (D._autoCache, ligado a la estructura actual: si cambian servicios o ajustes, se vuelve a calcular). */
  function _items(){
    var porSrv=(D.cargaModo==='servicios'), items=[];
    cadenas().forEach(function(C, ci){
      var cad=C.cad, ps=Math.max(1,parseInt(cad.porSlot,10)||1), sep=Math.max(1,parseFloat(cad.sep)||15), ini=aMin(cad.ini);
      C.grupos.forEach(function(t, gi){
        var sem=(t.modo==='semanal'), n=sem?1:Math.max(1,parseInt(t.fdn,10)||1), P=sem?1440:1440/n;
        var ven=(cad.ventanaH>0)?Math.min(cad.ventanaH*60+1, sem?1440:P):(sem?241:P);
        t.orden.map(svc).filter(Boolean).forEach(function(m, mi){
          var w=porSrv?1+D.servicios.filter(function(e){ return e.rol==='E'&&e.maestro===m.id; }).length:1;
          var it={m:m, k:C.clave, ci:ci, gi:gi, mi:mi, n:n, P:P, w:w, ps:ps, sep:sep, ini:ini, qmax:Math.max(1,Math.floor((ven-1)/sep)+1), pos:items.length};
          if(m.horaManual){ it.fijo=true; it.st=aMin(m.horaManual); } else if(m.slotManual){ it.fijo=true; it.q=parseInt(m.slotManual,10)-1; it.st=ini+it.q*sep; }
          items.push(it);
        });
      });
    });
    return items;
  }
  function _firma(){ return JSON.stringify([D.cargaModo||'', D.cadenas||{}, D.tipos.map(function(t){ return [t.id,t.modo,t.fdn,t.fd1,t.fd2,t.orden]; }),
    D.servicios.map(function(x){ return [x.id,x.rol,x.maestro,x.slotManual||'',x.horaManual||'']; })]); }
  function _franjas(it, st){ var f=[]; for(var i=0;i<it.n;i++) f.push(Math.floor((((st+i*it.P)%1440)+1440)%1440/30)%48); return f; }
  function _obj(load){ var mx=0,c=0,sq=0; for(var i=0;i<48;i++){ var v=load[i]; if(v>mx){ mx=v; c=1; } else if(v===mx) c++; sq+=v*v; } return [mx,c,sq]; }
  function _resolver(items, orden){
    var load=new Array(48).fill(0), usado={}, out={}, lastQ={};
    var add=function(it,st,sg){ _franjas(it,st).forEach(function(f){ load[f]+=sg*it.w; }); };
    items.forEach(function(it){ if(it.fijo){ add(it,it.st,1); if(it.q!=null){ var U=usado[it.k]=usado[it.k]||{}; U[it.q]=(U[it.q]||0)+1; } } });
    var libres=orden.filter(function(it){ return !it.fijo; });
    // 1) voraz
    libres.forEach(function(it){
      var U=usado[it.k]=usado[it.k]||{}, lq=(lastQ[it.k]==null?0:lastQ[it.k]), best=null;
      for(var q=0;q<it.qmax;q++){ if((U[q]||0)>=it.ps) continue; var st=it.ini+q*it.sep, mx=0, sum=0;
        _franjas(it,st).forEach(function(f){ var v=load[f]+it.w; if(v>mx) mx=v; sum+=v; });
        var sc=[mx,(q>=lq)?(q-lq):(1000+lq-q),sum]; if(!best||_cmp(sc,best.sc)<0) best={q:q,sc:sc}; }
      if(!best) best={q:it.qmax};
      U[best.q]=(U[best.q]||0)+1; lastQ[it.k]=best.q; out[it.m.id]=best.q; add(it,it.ini+best.q*it.sep,1);
    });
    // 2) mejora local: mover de hueco mientras mejore el objetivo
    for(var pasada=0; pasada<40; pasada++){
      var mejoro=false;
      libres.forEach(function(it){
        var U=usado[it.k], q0=out[it.m.id]; add(it,it.ini+q0*it.sep,-1); U[q0]--;
        var best={q:q0, sc:null};
        for(var q=0;q<it.qmax;q++){ if(q!==q0&&(U[q]||0)>=it.ps) continue; add(it,it.ini+q*it.sep,1);
          var sc=_obj(load).concat([Math.abs(q-q0)===0?0:1]); add(it,it.ini+q*it.sep,-1);
          if(best.sc===null||_cmp(sc,best.sc)<0) best={q:q,sc:sc}; }
        if(best.q!==q0) mejoro=true;
        out[it.m.id]=best.q; U[best.q]=(U[best.q]||0)+1; add(it,it.ini+best.q*it.sep,1);
      });
      if(!mejoro) break;
    }
    return {slots:out, obj:_obj(load)};
  }
  function repartoAuto(){
    var f=_firma();
    if(D._autoCache && D._autoCache.firma===f) return D._autoCache.slots;
    // 2026-11-10 — «que lo haga sola»: primero, si se puede, relaja las reglas que no dejan margen; luego, la búsqueda a fondo
    if(D.mejoraAuto!==false) mejorarReglas();
    redistribuir(150);
    return D._autoCache.slots;
  }
  /* 2026-11-10 — Rafa: «esta herramienta se destina a gente sin conocimientos, debe hacerlo sola… si sabes hacerlo
     mejor no te fijes en mis reglas, hazlo y dime cómo». Muebles SIN margen = tantos huecos como maestros con su
     separación y ventana. Se prueba a relajar sus reglas (menos separación: 1/2, 1/3, 30 o 15 min; en los semanales,
     1–2 h más de ventana), de una en una y hasta 3, quedándose con el cambio más pequeño que baje la franja más
     cargada (o el nº de franjas en ese máximo). Se aplica y se apunta en D.ajustes (con el valor original) para
     explicarlo y poder volver atrás. No se tocan los valores que el usuario ha cambiado a mano en el paso 4. */
  function huecosJustos(){
    var por={}; _items().forEach(function(it){ if(it.fijo) return; var x=por[it.k]=por[it.k]||{n:0, cap:it.qmax*it.ps}; x.n++; });
    return Object.keys(por).filter(function(k){ return por[k].n>=por[k].cap; });
  }
  function _evaluar(n){ var g=D._autoCache; D._autoCache=null; var o=redistribuir(n||25); D._autoCache=g; return o; }
  function mejorarReglas(){
    D.ajustes=D.ajustes||{};
    var cur=_evaluar(40);
    for(var vuelta=0; vuelta<3; vuelta++){
      var mejor=null;
      huecosJustos().forEach(function(k){
        var cad=(D.cadenas||{})[k]; if(!cad) return; var usr=cad._usr||{}, sem=/:semanal$/.test(k);

  // «🔀 Redistribuir»: muchos órdenes de partida distintos; se queda el mejor y se guarda en la plantilla
  function redistribuir(intentos){
    var items=_items(), base=items.slice().sort(function(a,b){ return (b.n-a.n)||(a.ci-b.ci)||(a.gi-b.gi)||(a.mi-b.mi); });
    var best=_resolver(items, base), semilla=12345;
    var rnd=function(){ semilla=(semilla*1103515245+12345)&0x7fffffff; return semilla/0x7fffffff; };
    for(var k=0;k<(intentos||150);k++){
      var ord=base.slice(); for(var i=ord.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var x=ord[i]; ord[i]=ord[j]; ord[j]=x; }
      ord.sort(function(a,b){ return b.n-a.n; });   // primero los que más se repiten, mezclados entre sí
      var r=_resolver(items, ord); if(_cmp(r.obj,best.obj)<0) best=r;
    }
    D._autoCache={firma:_firma(), slots:best.slots, obj:best.obj};
    return best.obj;
  }
  function calcular(){
    sincronizarOrden();

    var _auto=(D.reparto!=='orden')?repartoAuto():null;
    cadenas().forEach(function(C){ var kCad=0;
    C.grupos.forEach(function(t, gi){
      var cad=C.cad;
      // 2026-11-10 — Rafa (7026): «leche fresca» y «charcutería 1» caían juntas: con esta casilla cada grupo empieza en un hueco nuevo
      if(cad.huecoNuevo && gi>0){ var _ps=Math.max(1,parseInt(cad.porSlot,10)||1); if(kCad%_ps) kCad+=_ps-(kCad%_ps); }
      t.ini=cad.ini; t.sep=cad.sep; t.porSlot=cad.porSlot; t.dur=cad.dur;   // el informe los lee del grupo
      var M=t.orden.map(svc).filter(Boolean), porSlot=Math.max(1,parseInt(cad.porSlot,10)||1), sep=parseFloat(cad.sep)||0, ini=aMin(cad.ini);
      var fdn=Math.max(0,parseInt(t.fdn,10)||0), dit=parseFloat(t.dit)||0;
      if(t.modo==='diario' && fdn<1 && M.length) res.avisos.push(t.nombre+': Fdn = 0 → los maestros no tendrían desescarches diarios.');
      M.forEach(function(m){ var k=kCad++;
        var slot=(m.slotManual!=null&&m.slotManual!=='')?(parseInt(m.slotManual,10)-1):((_auto&&_auto[m.id]!=null)?_auto[m.id]:Math.floor(k/porSlot));   // slotManual: 1, 2, 3… (vacío = automático)
        var inicio=(m.horaManual)?aMin(m.horaManual):(ini+slot*sep)%1440;
        var esclavos=D.servicios.filter(function(s){ return s.rol==='E' && s.maestro===m.id; });
        var p, horas=[];
        if(t.modo==='semanal'){
          p={dCt:4, dOH:0, dit:dit, Fdn:0, d1H:24, d1n:0, Fd1:+t.fd1, Fd2:+t.fd2, F1H:Math.floor(inicio/60), F1n:inicio%60};
          horas=[inicio];
        } else {
          p={dCt:4, dOH:0, dit:dit, Fdn:fdn, d1H:Math.floor(inicio/60), d1n:inicio%60, Fd1:7, Fd2:7, F1H:null, F1n:null};
          for(var i=0;i<Math.max(1,fdn);i++) horas.push((inicio+i*1440/Math.max(1,fdn))%1440);
        }
        res.porSvc[m.id]={rol:'M', tipo:t, p:p, horas:horas, inicio:inicio, slot:slot};
        esclavos.forEach(function(e){
          res.porSvc[e.id]={rol:'E', tipo:t, maestro:m, p:{dCt:2, dOH:0, dit:dit+1, Fdn:0, d1H:null, d1n:null, Fd1:7, Fd2:7, F1H:null, F1n:null}, horas:horas.slice(), inicio:inicio, slot:slot};
        });
        res.grupos.push({tipo:t, maestro:m, esclavos:esclavos, inicio:inicio, horas:horas, slot:slot,
          etiqueta:(esclavos.length?'G. ':'')+m.nombre+(esclavos.length?' + '+esclavos.map(function(e){return e.nombre;}).join(' + '):'')});
      });
      deTipo(t.id).forEach(function(s){ if(s.rol==='E' && !(s.maestro && svc(s.maestro) && svc(s.maestro).rol==='M')) res.avisos.push(s.nombre+': está como esclavo pero sin maestro válido.'); });
    });
    });
    // carga por franjas de 30 min (día laborable; las islas semanales solo sus días)
    /* 2026-11-10 — Rafa (7026): el aviso daba 9 a la vez contando servicios; el gráfico del informe de referencia
       cuenta GRUPOS (maestro con sus esclavos = 1: de 00:00 a 00:30 salen 4) y suma las islas el día que
       desescarchan (01:00 → 6). Por defecto así; se puede elegir contar servicios. */
    var porSrv=(D.cargaModo==='servicios');
    var carga=new Array(48).fill(0), cargaSem=new Array(48).fill(0);
    Object.keys(res.porSvc).forEach(function(id){ var r=res.porSvc[id]; if(!porSrv && r.rol!=='M') return;
      r.horas.forEach(function(h){ var f=Math.floor(h/30)%48; carga[f]++; if(r.tipo.modo==='semanal') cargaSem[f]++; }); });
    res.carga=carga; res.cargaSem=cargaSem;
    var mx=Math.max.apply(null,carga), u=D.umbrales||{medio:5,alta:7};
    if(mx>=u.alta) res.avisos.push('Hay franjas de 30 min con '+mx+' '+(porSrv?'servicios':'grupos')+' desescarchando a la vez (alta, ≥ '+u.alta+'): conviene separar más los grupos.');
    // observaciones con los valores actuales (si se han leído del Televis)
    D.servicios.forEach(function(s){
      var a=s.actual; if(!a) return; var r=res.porSvc[s.id];
      if(+a.dit===0) res.avisos.push(s.nombre+': dit = 0 ahora mismo → no desescarcha nunca.');
      if(r&&r.rol==='M'&&r.tipo.modo==='diario'&&+a.dCt===4&&+a.d1H===24) res.avisos.push(s.nombre+': d1H = 24 ahora mismo → sin hora de inicio de desescarche laborable.');
      if(r&&r.rol==='M'&&r.tipo.modo==='semanal'&&(+a.F1H===24||a.F1H==null)) res.avisos.push(s.nombre+': hora de desescarche semanal (F1H) sin configurar ahora mismo.');
    });
    return res;
  }

  function dibujar(canvas, res){
    var filas=[]; D.tipos.forEach(function(t){ var orden=t.orden.map(svc).filter(Boolean); orden.forEach(function(m){ filas.push(m); D.servicios.filter(function(e){ return e.rol==='E'&&e.maestro===m.id; }).forEach(function(e){ filas.push(e); }); }); });
    var RH=15, IZQ=210, DER=20, TOP=72, W=1400, gW=W-IZQ-DER, hG=filas.length*RH, CH=190, H=TOP+hG+40+CH+50;
    canvas.width=W; canvas.height=H;

    c.fillStyle='#1F2937'; c.font='bold 15px Arial'; c.fillText('Distribución de desescarches por servicio — '+(D.cod?D.cod+' ':'')+(D.nombre||''),IZQ,20);

    c.fillStyle='#6B7280'; c.fillText('Barra llena = maestro · barra clara = esclavo',lx,39);
    var x=function(min){ return IZQ+gW*min/1440; };
    // rejilla horaria
    c.strokeStyle='#E5E7EB'; c.lineWidth=1; c.font='10px Arial'; c.fillStyle='#6B7280';
    for(var h=0;h<=24;h++){ var xx=x(h*60); c.beginPath(); c.moveTo(xx,TOP-6); c.lineTo(xx,TOP+hG); c.stroke(); if(h<24) c.fillText(String(h).padStart(2,'0')+':00', xx+2, TOP-8); }
    filas.forEach(function(s,i){
      var r=res.porSvc[s.id]; var y=TOP+i*RH; if(i%2===0){ c.fillStyle='#F9FAFB'; c.fillRect(IZQ,y,gW,RH); }
      c.fillStyle=(r&&r.rol==='E')?'#6B7280':'#111827'; c.font=(r&&r.rol==='E'?'':'bold ')+'10px Arial';
      c.fillText(((r&&r.rol==='E')?'   ↳ ':'')+s.nombre, 6, y+RH-4);
      if(!r) return; var t=r.tipo, dur=parseFloat(t.dur)||30;
      r.horas.forEach(function(hm){ c.fillStyle=t.color; c.globalAlpha=(r.rol==='E')?0.45:1; var w=Math.max(3,gW*dur/1440);
        c.fillRect(x(hm), y+2, w, RH-4); if(hm+dur>1440) c.fillRect(x(0), y+2, gW*(hm+dur-1440)/1440, RH-4); c.globalAlpha=1;
        if(t.modo==='semanal'){ c.fillStyle='#991B1B'; c.font='9px Arial'; c.fillText(diasTxt(t,true,'+'), x(hm)+w+3, y+RH-4); } });
    });
    // carga por franjas
    var y0=TOP+hG+40, u=D.umbrales||{medio:5,alta:7}, mx=Math.max(u.alta+1, Math.max.apply(null,res.carga)+1);
    c.fillStyle='#1F2937'; c.font='bold 13px Arial'; c.fillText((D.cargaModo==='servicios'?'Servicios':'Grupos (maestro + esclavos)')+' que empiezan a desescarchar en cada franja de 30 min', IZQ, y0-10);
    c.strokeStyle='#D1D5DB'; c.beginPath(); c.moveTo(IZQ,y0+CH); c.lineTo(IZQ+gW,y0+CH); c.stroke();
    var bw=gW/48;
    res.carga.forEach(function(v,i){
      var col=v>=u.alta?'#C0392B':(v>=u.medio?'#E67E22':'#27AE60'); var bh=CH*v/mx;
      c.fillStyle=col; c.fillRect(IZQ+i*bw+1, y0+CH-bh, bw-2, bh);
      if(v){ c.fillStyle='#374151'; c.font='9px Arial'; c.fillText(String(v), IZQ+i*bw+bw/2-3, y0+CH-bh-3); }
      if(res.cargaSem[i]){ c.fillStyle='#991B1B'; c.font='9px Arial'; c.fillText('isla', IZQ+i*bw+bw/2-7, y0+CH+12); }
    });
    c.fillStyle='#6B7280'; c.font='10px Arial';
    for(var hh=0;hh<24;hh+=2) c.fillText(String(hh).padStart(2,'0')+':00', IZQ+hh*2*bw, y0+CH+26);
    c.fillText('Verde < '+u.medio+' · naranja '+u.medio+(u.alta-1>u.medio?'–'+(u.alta-1):'')+' · rojo ≥ '+u.alta+'   ·   «isla» = incluye islas semanales (los días que desescarchan)', IZQ, y0+CH+42);

  function explicacion(res){
    var ud=(D.cargaModo==='servicios'?'servicios':'grupos (maestro con sus esclavos)'), mx=Math.max.apply(null,res.carga);
    var nMx=res.carga.filter(function(v){ return v===mx; }).length, tot=res.carga.reduce(function(a,b){ return a+b; },0);
    var porOrden=(function(){ if(D.reparto==='orden') return null; var r=D.reparto; D.reparto='orden'; var x=calcular(); D.reparto=r; return Math.max.apply(null,x.carga); })();
    var L=[];
    L.push('<b>Criterio:</b> que coincidan los menos desescarches posibles. Se cuentan los '+ud+' que empiezan a desescarchar en cada franja de 30 minutos a lo largo de las 24 h (cada uno se repite según su Fdn) y se busca que la franja más cargada sea la más baja posible; después, que haya pocas franjas en ese máximo y que el resto quede lo más igualado posible. Así la central no tiene que recuperar muchos muebles a la vez.');
    L.push('<b>Cómo:</b> cada maestro se prueba en todos los huecos que permite su mueble (primer arranque, separación entre huecos, ventana y máximo de maestros por hueco) y se queda en el que menos carga, teniendo en cuenta todos los muebles juntos (murales, cámaras, vitrinas, armarios e islas). Se repite con muchos órdenes de partida distintos y se queda el mejor. Los esclavos desescarchan con su maestro (Link2) y no ocupan hueco propio.');
    cadenas().forEach(function(C){ var cad=C.cad, g=C.grupos[0], nM=0; C.grupos.forEach(function(t){ nM+=t.orden.length; });
      L.push('<b>'+esc(cad.nombre)+'</b> ('+nM+' maestro(s)): '+(g.modo==='semanal'?'desescarche semanal ('+diasTxt(g)+')':'cada '+(Math.round(1440/Math.max(1,g.fdn))/60)+' h')+'; huecos cada '+cad.sep+' min desde las '+esc(cad.ini)+(cad.ventanaH?' durante '+cad.ventanaH+' h':'')+', hasta '+cad.porSlot+' maestro(s) por hueco.'); });
    var aj=textoAjustes();
    if(aj.length) L.push('<b>Ajustes automáticos:</b> con las reglas iniciales había muebles sin margen (tantos huecos como maestros), así que se han relajado para repartir mejor: '+esc(aj.join('; '))+'.');
    L.push('<b>Resultado:</b> coinciden como mucho <b>'+mx+'</b> '+ud+' a la vez ('+nMx+' franja(s) de 48 en ese máximo; media '+(Math.round(tot/48*10)/10)+' por franja)'+(porOrden!=null&&porOrden!==mx?'. Repartiendo por orden, uno detrás de otro, serían '+porOrden:'')+'.');
    return L;
  }

    box.innerHTML=caja('Programaciones guardadas'+(r&&r.bd===false?' <span style="color:#f5a623;font-size:13px;">(sin base de datos)</span>':''),
      L.length?L.map(function(x){ return '<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--bd);font-size:13px;"><b>'+esc(x.cod)+'</b> '+esc(x.nombre||'')+' <span style="color:var(--mu);">· programación del '+esc(fFecha(x.fecha))+' · '+(x.servicios||0)+' servicios · guardado '+esc(String(x.actualizado||'').slice(0,16))+'</span><span style="flex:1"></span><button class="tb tb-sm" onclick="desAbrir(\''+esc(x.cod)+'\')">Abrir</button><button class="tb tb-sm tb-gh" style="color:#ef4444;" onclick="desBorrar(\''+esc(x.cod)+'\')">🗑</button></div>'; }).join('')
        :'<div style="font-size:13px;color:var(--mu);">No hay programaciones guardadas.</div>');
  };
  window.desAbrir=async function(cod){
    var r=null; try{ r=await api()('GET','/desescarchaGet?cod='+encodeURIComponent(cod),null,20000); }catch(e){}
    if(!(r&&r.ok&&r.plan)){ alert('No se ha podido abrir.'); return; }
    if(D&&D.servicios.length&&!confirm('Se abre la programación de '+cod+' y se sustituye la de la pantalla. ¿Seguir?')) return;
    D=r.plan; paso=4; pintar();
  };
  window.desBorrar=async function(cod){
    if(!confirm('¿Borrar la programación guardada de '+cod+'?')) return;
    try{ await api()('POST','/desescarchaBorrar',{cod:cod},20000); }catch(e){}
    window.desAbrirLista();
  };
  window.desGuardarArchivo=function(){ D.guardado=new Date().toISOString().slice(0,16); guardarBorrador(); dl(JSON.stringify(D,null,1),'application/json',nombreArchivo('json').replace(/^Desescarches_/,'Programacion_desescarches_')); };
  window.desAbrirArchivo=function(){
    var i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
    i.onchange=function(){ var f=i.files&&i.files[0]; if(!f) return; var r=new FileReader();
      r.onload=function(){ try{ var p=JSON.parse(r.result); if(!p||!p.tipos||!p.servicios) throw new Error('no es una programación de Desescarcha');
        if(D&&D.servicios.length&&!confirm('Se sustituye la programación de la pantalla. ¿Seguir?')) return; D=p; paso=4; sincronizarOrden(); pintar(); }catch(e){ alert('No se ha podido abrir: '+e.message); } };
      r.readAsText(f,'utf-8'); };
    i.click();
  };
  window.desAsegurar=function(){ if(!D){ D=cargarBorrador()||plan0(); } if(D&&D.tipos) D.tipos=D.tipos.filter(function(t){ return deTipo(t.id).length||t.orden&&t.orden.length; }); pintar(); };
  // para pruebas
  window._desEstado=function(){ return D; }; window._desCalcular=function(){ return calcular(); }; window._desInformeHtml=function(){ return informeHtml(); };
  window._desCargar=function(p){ D=p; sincronizarOrden(); pintar(); };
  document.addEventListener('DOMContentLoaded', function(){ window.desAsegurar(); });
})();
</script>
<script>/* app instalable: se guarda para usarla sin cobertura */if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js');}</script>
